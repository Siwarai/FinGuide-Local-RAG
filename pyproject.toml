[project]
name = "FinGuide-Local-RAG"
version = "0.1.0"
description = "Local Financial RAG Assistant"
readme = "README.md"
requires-python = ">=3.10"

[tool.pyrefly]
search_paths = [".", ".venv/Lib/site-packages"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = [".", ".venv/Lib/site-packages"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

